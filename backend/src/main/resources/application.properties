spring.application.name=backend
server.port=8080

# Mac dinh chay bang H2 (in-memory) de ca nhom clone ve la chay duoc ngay.
spring.datasource.url=jdbc:h2:mem:nhahang;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Khi dung MySQL: chay voi --spring.profiles.active=mysql (xem application-mysql.properties)
spring.jpa.defer-datasource-initialization=true
